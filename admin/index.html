<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
    <title>일일 사용자 지표</title>
    <link rel="icon" type="image/png" href="/icon_green.png">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="admin-body">
    <div class="background-glow"></div>
    <div class="admin-shell">

        <div id="admin-auth" class="glass-panel admin-card is-hidden">
            <div class="auth-header">
                <img class="auth-icon" src="/icon_green.png" width="48" height="48" alt="">
                <h2>운영자 확인</h2>
            </div>
            <p class="auth-desc">이 페이지는 운영자만 볼 수 있습니다.<br />치지직 계정으로 로그인해 주세요.</p>
            <button id="admin-login-btn" class="chzzk-btn chzzk-btn-glow">치지직 계정으로 확인</button>
        </div>

        <div id="admin-forbidden" class="glass-panel admin-card is-hidden">
            <div class="auth-header">
                <img class="auth-icon" src="/icon_red.png" width="48" height="48" alt="">
                <h2>접근할 수 없습니다</h2>
            </div>
            <p class="auth-desc">이 페이지는 운영자만 볼 수 있습니다.</p>
            <a href="/" class="chzzk-btn">메인으로</a>
        </div>

        <div id="admin-dashboard" class="admin-dashboard is-hidden">
            <header class="admin-header">
                <div class="header-title">
                    <img class="header-logo" src="/icon_green.png" width="34" height="34" alt="">
                    <span>일일 사용자 지표</span>
                </div>
                <p class="admin-timezone" id="admin-timezone">한국 시간(KST) 기준 · 로그인 사용자만 집계</p>
            </header>

            <div id="admin-stats" class="admin-stats">
                <div class="stat-item admin-stat">
                    <span class="label">오늘 활성 사용자</span>
                    <span class="value" id="metric-dau">—</span>
                </div>
                <div class="stat-item admin-stat">
                    <span class="label">오늘 방문</span>
                    <span class="value" id="metric-visits">—</span>
                </div>
                <div class="stat-item admin-stat">
                    <span class="label">오늘 신규</span>
                    <span class="value" id="metric-new">—</span>
                </div>
                <div class="stat-item admin-stat">
                    <span class="label">오늘 재방문</span>
                    <span class="value" id="metric-returning">—</span>
                </div>
            </div>

            <div class="admin-summary">
                <span>누적 고유 사용자 <strong id="metric-unique">—</strong></span>
                <span>7일 평균 DAU <strong id="metric-avg7">—</strong></span>
                <span>30일 평균 DAU <strong id="metric-avg30">—</strong></span>
            </div>

            <section class="glass-panel admin-chart-panel">
                <div class="admin-chart-head">
                    <h3>최근 30일 DAU</h3>
                    <button type="button" id="admin-refresh-btn" class="refresh-btn admin-refresh-btn" title="새로고침">
                        <svg class="refresh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>새로고침</span>
                    </button>
                </div>
                <svg id="dau-chart" class="metrics-chart" viewBox="0 0 300 120" role="img" aria-label="최근 30일 일일 활성 사용자"></svg>
                <div class="metrics-chart-axis">
                    <span id="chart-oldest"></span>
                    <span id="chart-newest"></span>
                </div>
            </section>

            <section class="glass-panel admin-table-panel">
                <h3>일자별</h3>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>DAU</th>
                                <th>방문</th>
                                <th>신규</th>
                                <th>재방문</th>
                            </tr>
                        </thead>
                        <tbody id="metrics-table-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="/js/admin.js"></script>
</body>

</html>
