# Cheese Stick Dock — Cloudflare Pages 프로젝트 설정
# 자세한 내용: https://developers.cloudflare.com/pages/functions/bindings/#kv-namespaces

name = "cheese-stick-dock"
# pages_build_output_dir를 넣으면 Git 배포 시 wrangler.toml이 설정의 기준이 됩니다.
# kv_namespaces가 비어 있으면 대시보드에 묶어둔 KV가 배포마다 사라질 수 있으므로 넣지 않습니다.
# (KV ID를 wrangler.toml에 채운 뒤에만 pages_build_output_dir = "." 를 활성화하세요.)
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace 바인딩
# 1. Cloudflare 대시보드 → Workers & Pages → KV → Create namespace
# 2. 생성된 namespace의 ID를 아래에 입력
# 3. 또는 CLI: wrangler kv namespace create "LIVE_STATUS_CACHE"
#               wrangler kv namespace create "SESSION_STORE"

# [[ kv_namespaces ]]
# binding = "LIVE_STATUS_CACHE"
# id = "여기에_KV_NAMESPACE_ID_입력"

# [[ kv_namespaces ]]
# binding = "SESSION_STORE"
# id = "세션_전용_KV_NAMESPACE_ID_입력"

# 로컬 개발 시 KV를 자동 에뮬레이션하려면:
# wrangler pages dev . --kv LIVE_STATUS_CACHE --kv SESSION_STORE
#
# 프로덕션 배포 (Git 연동 대신 CLI 사용 시):
# wrangler pages deploy . --project-name=cheese-stick-dock --branch=main
